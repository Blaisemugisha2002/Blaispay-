name: Deploy BlaisePay App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare BlaisePay App
        run: |
          mkdir _site
          cp -R App/. _site/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload BlaisePay
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy BlaisePay
        id: deployment
        uses: actions/deploy-pages@v4
