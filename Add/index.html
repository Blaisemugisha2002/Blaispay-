<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BlaisePay</title>

  <meta name="theme-color" content="#087f5b">
  <meta name="description" content="BlaisePay AI-powered mobile money platform">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="app-header">
    <div>
      <h1>BlaisePay</h1>
      <p>AI-powered mobile money</p>
    </div>
  </header>

  <main class="container">

    <section class="balance-card">
      <p>Total Balance</p>
      <h2>KES 0.00</h2>
      <p class="muted">Demo balance</p>
    </section>

    <section class="quick-actions">

      <button onclick="alert('Send Money demo')">
        💸<span>Send Money</span>
      </button>

      <button onclick="alert('Withdraw Cash demo')">
        🏧<span>Withdraw</span>
      </button>

      <button onclick="alert('Deposit demo')">
        💰<span>Deposit</span>
      </button>

      <button onclick="alert('Buy Airtime demo')">
        📱<span>Airtime</span>
      </button>

      <button onclick="alert('Lipa na M-PESA demo')">
        🛒<span>Lipa na M-PESA</span>
      </button>

      <button onclick="alert('Bank demo')">
        🏦<span>Bank</span>
      </button>

      <button onclick="alert('Scan Center demo')">
        📷<span>Scan</span>
      </button>

      <button onclick="alert('Transactions demo')">
        📋<span>Transactions</span>
      </button>

    </section>

    <section class="assistant-card">
      <h2>🎙️ BlaisePay Assistant</h2>
      <p>Use voice or type a command.</p>

      <button onclick="alert('Voice Assistant demo')">
        🎤 Speak
      </button>

      <button onclick="alert('Type command demo')">
        ⌨️ Type
      </button>
    </section>

    <section class="services">
      <h2>Services</h2>

      <div class="service-list">
        <div>📞 Contacts</div>
        <div>💳 M-PESA</div>
        <div>🏦 Bank Transfer</div>
        <div>💵 Loans & Savings</div>
        <div>🔐 Security</div>
        <div>⚙️ Settings</div>
      </div>
    </section>

  </main>

  <footer>
    <p>BlaisePay Demo • Secure financial technology</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
